# Payload fields of the `sowing` event (Sowing / transplanting); keys equal B06's `events.payloads.SowingPayload`.
# Serves: D-017, FR22 (crop event schema), FR23 (configurable capture), UserFlows §Logging an event.
# Read by: agritrace/core/fieldconfig.py; served to clients (M07, M10, M11). Not enforced by a server
# hook yet: events (B06) calls fieldconfig.validate_payload("event_sowing", ...) when it wires it.
# Photos and voice notes travel in the entry envelope (`photos[]`), not in the payload, so they are not
# listed. tests/unit/test_fieldconfig_events.py keeps this file and the payload model in step.
entity: event_sowing
extra: allow
fields:
  - {name: seed_variety, type: text, required: false, enabled: true, visibility: public, stage: cultivation, label: {en: Seed variety, ta: விதை ரகம்}}
  - {name: method, type: choice, required: false, enabled: true, visibility: public, stage: cultivation, label: {en: Direct seeding or transplanting, ta: நேரடி விதைப்பு அல்லது நடவு}}
  - {name: sown_area, type: quantity, required: false, enabled: true, visibility: partner, stage: cultivation, label: {en: Area sown, ta: விதைத்த பரப்பு}}
