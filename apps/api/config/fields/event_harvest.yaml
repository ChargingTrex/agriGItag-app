# Payload fields of the `harvest` event (Harvest).
# Serves: D-017, FR22 (crop event schema), FR23 (configurable capture), UserFlows §Logging an event.
# Read by: agritrace/core/fieldconfig.py; served to clients (M07, M10, M11). Not enforced by a server
# hook yet: events (B06) calls fieldconfig.validate_payload("event_harvest", ...) when it wires it.
# extra: allow keeps payload keys not listed here (B06 owns the payload shape). Keys: see farmer.yaml.
entity: event_harvest
extra: allow
fields:
  - {name: bags, type: integer, required: true, enabled: true, visibility: internal, stage: harvest, label: {en: Bags, ta: மூட்டைகள்}}
  - {name: quantity, type: quantity, required: true, enabled: true, visibility: partner, stage: harvest, label: {en: Quantity, ta: அளவு}}
  - {name: photo, type: photo, required: false, enabled: true, visibility: public, stage: harvest, label: {en: Photo, ta: புகைப்படம்}}
