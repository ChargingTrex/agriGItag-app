# Payload fields of the `drying` event (Drying); keys equal B06's `events.payloads.DryingPayload`.
# Serves: D-017, FR22 (crop event schema), FR23 (configurable capture), UserFlows §Logging an event.
# Read by: agritrace/core/fieldconfig.py; served to clients (M07, M10, M11). Not enforced by a server
# hook yet: events (B06) calls fieldconfig.validate_payload("event_drying", ...) when it wires it.
# Photos and voice notes travel in the entry envelope (`photos[]`), not in the payload, so they are not
# listed. tests/unit/test_fieldconfig_events.py keeps this file and the payload model in step.
entity: event_drying
extra: allow
fields:
  - {name: phase, type: choice, required: false, enabled: true, visibility: internal, stage: drying, label: {en: Start or done, ta: தொடக்கம் அல்லது முடிவு}}
  - {name: quantity, type: quantity, required: false, enabled: true, visibility: partner, stage: drying, label: {en: Quantity spread, ta: உலர வைத்த அளவு}}
  - {name: moisture_reading_id, type: id, required: false, enabled: true, visibility: internal, stage: drying, label: {en: Moisture reading, ta: ஈரப்பதம் அளவீடு}}
