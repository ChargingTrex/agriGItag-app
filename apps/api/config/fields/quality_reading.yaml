# Quality reading fields (moisture, grading parameters, lab results).
# Serves: D-017, Stage 6–8, FR42–FR50 (method, source, instrument, lab provenance).
# Read by: agritrace/core/fieldconfig.py; served to clients (M10, M11). Not enforced by a server hook yet:
# quality (B05) calls fieldconfig.validate_payload("quality_reading", ...) when wired. Keys: see farmer.yaml.
entity: quality_reading
extra: allow
fields:
  - {name: stage, type: choice, required: true, enabled: true, core: true, visibility: partner, stage: intake, label: {en: Stage, ta: நிலை}}
  - {name: parameter_code, type: choice, required: true, enabled: true, core: true, visibility: partner, stage: intake, label: {en: Parameter, ta: அளவுரு}}
  - {name: measurement, type: quantity, required: true, enabled: true, core: true, visibility: partner, stage: intake, label: {en: Value, ta: அளவு}}
  - {name: source, type: choice, required: true, enabled: true, core: true, visibility: partner, stage: intake, label: {en: Measured by, ta: அளந்த முறை}}
  - {name: method_ref, type: text, required: false, enabled: true, visibility: partner, stage: intake, label: {en: Test method, ta: சோதனை முறை}}
  - {name: instrument_id, type: id, required: false, enabled: true, visibility: internal, stage: intake, label: {en: Instrument, ta: கருவி}}
  - {name: lab_name, type: text, required: false, enabled: true, visibility: partner, stage: grading, label: {en: Laboratory, ta: ஆய்வகம்}}
  - {name: lab_nabl_no, type: text, required: false, enabled: true, visibility: partner, stage: grading, label: {en: NABL number, ta: என்ஏபிஎல் எண்}}
  - {name: sample_id, type: text, required: false, enabled: true, visibility: internal, stage: grading, label: {en: Sample id, ta: மாதிரி எண்}}
  - {name: certificate_photo_id, type: photo, required: false, enabled: true, visibility: internal, stage: grading, label: {en: Lab certificate photo, ta: ஆய்வகச் சான்றிதழ் படம்}}
  - {name: evidence_photo_id, type: photo, required: false, enabled: true, visibility: internal, stage: intake, label: {en: Reading photo, ta: அளவீட்டுப் படம்}}
  - {name: reason_code, type: choice, required: false, enabled: true, visibility: internal, stage: intake, label: {en: Reason, ta: காரணம்}}
