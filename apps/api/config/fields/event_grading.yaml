# Payload fields of the `grading` event (Grading).
# Serves: D-017, FR22 (crop event schema), FR23 (configurable capture), UserFlows §Logging an event.
# Read by: agritrace/core/fieldconfig.py; served to clients (M07, M10, M11). Not enforced by a server
# hook yet: events (B06) calls fieldconfig.validate_payload("event_grading", ...) when it wires it.
# extra: allow keeps payload keys not listed here (B06 owns the payload shape). Keys: see farmer.yaml.
entity: event_grading
extra: allow
fields:
  - {name: declared_grade, type: choice, required: true, enabled: true, visibility: public, stage: grading, label: {en: Grade, ta: தரம்}}
  - {name: quantity, type: quantity, required: false, enabled: true, visibility: partner, stage: grading, label: {en: Graded weight, ta: தரம் பிரித்த எடை}}
