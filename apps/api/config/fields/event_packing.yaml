# Payload fields of the `packing` event (Packing); keys equal B06's `events.payloads.PackingPayload`.
# Serves: D-017, FR22 (crop event schema), FR23 (configurable capture), UserFlows §Logging an event.
# Read by: agritrace/core/fieldconfig.py; served to clients (M07, M10, M11). Not enforced by a server
# hook yet: events (B06) calls fieldconfig.validate_payload("event_packing", ...) when it wires it.
# Photos and voice notes travel in the entry envelope (`photos[]`), not in the payload, so they are not
# listed. tests/unit/test_fieldconfig_events.py keeps this file and the payload model in step.
entity: event_packing
extra: allow
fields:
  - {name: quantity, type: quantity, required: true, enabled: true, visibility: partner, stage: packing, label: {en: Quantity, ta: அளவு}}
  - {name: bags, type: integer, required: true, enabled: true, visibility: internal, stage: packing, label: {en: Bags, ta: மூட்டைகள்}}
