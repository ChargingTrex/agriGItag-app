  - {name: category, type: choice, required: true, enabled: true, core: true, visibility: public, stage: master_data, label: {en: Category, ta: வகை}}
  - {name: unit, type: text, required: true, enabled: true, core: true, visibility: public, stage: master_data, label: {en: Unit, ta: அலகு}}
