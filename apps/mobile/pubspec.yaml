# AgriTrace mobile app (farmer, field officer and QC modes in one app). Plan §7.2, mobile-design.md.
# Flavors dev/staging/prod: entry points lib/main_{dev,staging,prod}.dart plus --dart-define=API_BASE_URL=...
# Every dependency below has a row in docs/LIBRARIES.md (D-018).
name: agritrace
description: "AgriTrace: farm-to-consumer traceability for GI-tagged produce (mobile app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.3

dependencies:
  # Generated from packages/openapi/openapi.json by tool/gen_api.sh; never edited by hand (D-003).
  agritrace_api:
    path: packages/agritrace_api
  camera: ^0.12.0+2
  crypto: ^3.0.8
  # Exact decimals in the grade/yield/moisture previews, matching the server engine's Decimal (D-006, M03).
  decimal: ^3.2.6
  # Network type for Wi-Fi-only photos and sync metrics; a change triggers the reachability probe (M02).
  connectivity_plus: ^7.3.1
  # 15-min background sync: Android WorkManager, iOS BGAppRefresh (lib/core/sync/background_scheduler.dart, M02).
  workmanager: ^0.10.10
  dio: ^5.11.1
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.2
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  image: ^4.12.0
  intl: ^0.20.2
  record: ^6.2.1
  # Plays the bundled Opus voice prompts (lib/core/voice/voice_player.dart, D-016).
  just_audio: ^0.10.6
  # Opens the dialer for "Call officer" (lib/core/widgets/call_officer_button.dart).
  url_launcher: ^6.3.2
  smart_auth: ^3.2.0
  uuid: ^4.6.0
  # Draws the onboarding handoff QR (lib/features/onboarding_farmer/handoff_step.dart, M09).
  qr_flutter: ^4.1.0
  # Reads the lot QR at the QC intake (lib/features/qc_intake/scan_screen.dart, M11).
  mobile_scanner: ^7.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Runs flutter gen-l10n (l10n.yaml) on pub get, run and build.
  generate: true
  # Voice prompts: manifest + Opus clips per bundled language (mobile-design.md §5).
  # DECISION D-016: ta and en clips ship inside the app; other languages arrive as downloadable bundles.
  #   ADV: the first run speaks offline.  COMPROMISE: every clip adds to the APK (~1.5 KB placeholders now,
  #   about 3 KB per second of real 24 kbps speech).
  assets:
    - assets/prompts.json
    - assets/audio/ta/
    - assets/audio/en/
    # Picture cards of the onboarding wizard (M09); 96 px WebP placeholders until the photographed set lands.
    - assets/images/water/
    - assets/images/practice/
    - assets/images/crops/
  fonts:
    # Tamil-block subset of Noto Sans Tamil Regular (35 KB, SIL OFL 1.1, licence in assets/fonts/).
    # DECISION D-016: Tamil ships inside the app so first run works offline with consistent glyphs.
    #   ADV: no dependence on the phone's system Tamil font; tiny cost.
    #   COMPROMISE: one weight only; bold Tamil is synthesised by the engine.
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-sub.ttf
