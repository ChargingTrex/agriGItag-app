# build_runner options for the Drift offline store (lib/core/db, WP-M01). mobile-design.md §2.
# Callers: `dart run build_runner build --delete-conflicting-outputs` (writes lib/core/db/**/*.g.dart, committed)
#   and tool/schema_dump.sh (drift_dev schema tool reads the same options).
targets:
  $default:
    builders:
      drift_dev:
        options:
          # DECISION D-026: store DateTime as ISO-8601 text with milliseconds instead of whole Unix seconds.
          #   ADV: millisecond precision for the "Sent" ≤ 5 s metric and the three clocks; readable in a DB dump.
          #   COMPROMISE: SQL comparisons go through julianday() (Drift does it; order by column.julianday), so
          #   indexes on date columns help less; changing it later means migrating every date column.
          store_date_time_values_as_text: true
          databases:
            default: lib/core/db/database.dart
          schema_dir: test/db/drift_schemas/
          test_dir: test/db/
