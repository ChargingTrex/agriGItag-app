# flutter gen-l10n configuration. UserFlows §Design rules "Language first": Tamil is the default (D-016).
# The Tamil file is the template, so every key exists in Tamil first; required-resource-attributes makes
# gen-l10n fail when a key has no @description.
arb-dir: lib/core/l10n
template-arb-file: app_ta.arb
output-dir: lib/core/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales: [ta]
required-resource-attributes: true
nullable-getter: false
# File header of the generated Dart files (CLAUDE.md §5 headers; checked by infra/scripts/doc-coverage.py).
header: "// GENERATED by flutter gen-l10n from lib/core/l10n/app_ta.arb and app_en.arb (l10n.yaml). Do not edit; edit the ARB files.\n// Requirement: UserFlows §Design rules \"Language first\" (D-016). Callers: lib/app.dart and every screen via AppLocalizations.of."
