# Android Go-class AVD hardware profile (API 27, Android 8.1).
# Serves: plan §7.5 Q00 (Go AVD: API 27, 2 GB, 2 cores, 720x1280), §3 G3, BM-01, BM-02, BM-11..BM-14.
# Read by: qa/avd/create_go_avd.sh, which merges these keys into ~/.android/avd/agritrace_go_api27.avd/config.ini.
# Lines starting with # are stripped before merging. The system image is chosen by the script.
# Limit: this reproduces the Go hardware budget only; the Go build flag ro.config.low_ram is not set.
hw.ramSize=2048
hw.cpu.ncore=2
hw.lcd.width=720
hw.lcd.height=1280
hw.lcd.density=320
disk.dataPartition.size=2G
vm.heapSize=128
hw.keyboard=yes
hw.gpu.enabled=yes
hw.gpu.mode=auto
