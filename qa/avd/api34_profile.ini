# Standard (mid-range) AVD hardware profile (API 34, Android 14).
# Serves: plan §7.5 Q01 (widget/golden/integration on Go + API 34 AVDs).
# Read by: qa/avd/create_go_avd.sh api34, which merges these keys into ~/.android/avd/agritrace_std_api34.avd/config.ini.
# Lines starting with # are stripped before merging. The system image is chosen by the script.
hw.ramSize=4096
hw.cpu.ncore=4
hw.lcd.width=1080
hw.lcd.height=2400
hw.lcd.density=420
disk.dataPartition.size=6G
vm.heapSize=256
hw.keyboard=yes
hw.gpu.enabled=yes
hw.gpu.mode=auto
