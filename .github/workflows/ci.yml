# AgriTrace CI: backend lint and tests, documentation gates, Robot smoke against the compose stack.
# Serves: plan §3 (G0 "CI green on empty tests"; every gate: LIBRARIES.md in sync, error codes regenerated),
#         §4 item 6 (doc coverage, BM-10), §9.1 (Robot suites in CI), D-008 (LocalStack S3), D-010, D-018,
#         D-021 (Valkey).
# Owners: Q00 wrote this file; B00 owns the Makefile targets and infra/docker-compose.yml it calls;
#         M00 and P00 replace the mobile/portal stubs at the bottom; W02 owns the public-page job
#         (BM-03, BM-09, BM-16).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # No service containers: apps/api/tests/conftest.py (B00) starts PostGIS, the Redis-protocol broker and
    # LocalStack S3 itself with testcontainers and points DATABASE_URL / REDIS_URL / S3_* at them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --directory apps/api
      - run: make lint
      - run: make test-unit
      - run: make test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: QA script self-tests (privacy lint, benchmark collector, ledger and Flutter parsers)
        run: uv run --no-project --with pytest --with pyyaml --with robotframework==7.5 pytest qa/tests -q
      - name: Lint the QA layer's own Python
        run: uvx ruff@0.17.3 check infra/scripts qa
      - name: Docstring coverage of the QA layer
        run: uvx interrogate@1.7.0 -vv --fail-under 100 infra/scripts qa/robot/lib qa/scripts
      # Flutter and Node toolchains so doc-coverage.py can run the Dart and TS documentation lints.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
        working-directory: apps/portal
      - name: Doc coverage of the apps (BM-10)
        run: uv run --no-project python infra/scripts/doc-coverage.py
      - name: Libraries ledger (D-018)
        run: uv run --no-project --with pyyaml python infra/scripts/libraries-check.py
      - name: Error codes registry is regenerated and registered
        run: |
          make error-codes
          git diff --exit-code docs/api/error-codes.md

  robot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Start stack (PostGIS, Valkey, LocalStack S3 + bucket init, api, worker)
        run: make up
      - name: Install Robot toolchain
        run: |
          uv venv qa/.venv --python 3.12
          uv pip install --python qa/.venv/bin/python -r qa/robot/requirements.txt
      - name: Robot smoke (api/healthz.robot)
        run: qa/.venv/bin/robot --outputdir qa/robot/results/ci --exclude not-ready qa/robot/api/healthz.robot
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-smoke
          path: qa/robot/results/ci
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true
      # Java 17 for Gradle (size check) and openapi-generator (gen_api.sh); Node is preinstalled on the runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - name: Farmer screens have no free-text fields
        run: tool/no_textfield_lint.sh
      - name: Shared rule fixtures identical to the server's (D-006 contract test)
        run: tool/check_shared_fixtures.sh
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze (incl. public_member_api_docs)
        run: flutter analyze --fatal-infos
      - name: Tests (unit, widget, goldens)
        run: flutter test
      - name: Generated API client and l10n match the spec and ARB files
        run: tool/gen_api.sh && git diff --exit-code -- packages/agritrace_api lib/core/l10n/gen
      - name: Size budget (arm64 APK; skipped when the runner has no Android SDK)
        run: tool/size_check.sh

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      # D-003: regenerate the client from packages/openapi/openapi.json and the error table from
      # docs/api/error-codes.md; fails when the committed files differ.
      - run: npm run gen:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Initial bundle size (fails above 400 KB gzipped)
        shell: bash # explicit bash adds -o pipefail, so the budget failure survives the tee
        run: node scripts/bundle-size.ts | tee -a "$GITHUB_STEP_SUMMARY"
      # P07: the admin chain (run twice) and axe on every screen, in MSW mock mode (no stack; D-052).
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e chain + axe (mock mode)
        run: npm run e2e

  public-page:
    # W02: build the fixture page and gate the built files (FR-16, FR-19; BM-03, BM-09, BM-16).
    # DECISION D-007: the page is one static file, so every check runs on the build output; Lighthouse CI
    #   serves out/site itself with gzip, as the CDN would.
    #   ADV: no backend or stack needed; the job checks exactly what B10 will upload.
    #   COMPROMISE: the fixture stands in for real batches; B10's publish path is checked by Q03.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/public-page
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/public-page/package-lock.json
      - run: uv sync
      - run: uv run ruff check .
      - name: Renderer and canary tests (includes "injected canary fails the privacy lint")
        run: uv run pytest -q
      - run: npm ci
      - name: Build the fixture page
        run: uv run python -m agritrace_page build fixtures/batch_sample.json out/site
      - name: Privacy lint with canaries (BM-09)
        run: tools/check_output.sh out/site
      - name: HTML validation, 0 errors
        run: npm run validate
      - name: Unavailable page (W03), the CDN 404 for unknown codes, validated and privacy-linted
        run: |
          uv run python -m agritrace_page unavailable unknown out/unavailable
          npx --no-install html-validate out/unavailable
          tools/check_output.sh out/unavailable
      - name: Size budgets, CSS < 12 KB, JS < 4 KB, HTML+CSS+JS < 100 KB (plan §13 E1, BM-16)
        run: uv run python -m agritrace_page check out/site
      - name: Lighthouse CI 3G (BM-03), runner's Chrome
        run: npm run lhci:3g
      - name: Lighthouse CI normal 4G (BM-16), runner's Chrome
        run: npm run lhci:4g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: apps/public-page/out/lhci
